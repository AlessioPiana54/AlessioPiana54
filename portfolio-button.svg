<svg xmlns="http://www.w3.org/2000/svg" width="420" height="72" viewBox="0 0 420 72">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7F00FF"/>
      <stop offset="1" stop-color="#2E5BFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="pill">
      <rect x="2" y="2" width="416" height="68" rx="34" ry="34"/>
    </clipPath>
  </defs>
  <style>
    .label { font: 700 26px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: 0.5px; }
    .shine { animation: sweep 3.5s ease-in-out infinite; }
    @keyframes sweep {
      0%   { transform: translateX(-160px); }
      60%  { transform: translateX(440px); }
      100% { transform: translateX(440px); }
    }
  </style>
  <rect x="2" y="2" width="416" height="68" rx="34" ry="34" fill="url(#g)"/>
  <g clip-path="url(#pill)">
    <rect class="shine" x="0" y="0" width="120" height="72" fill="url(#shine)"/>
  </g>
  <text class="label" x="210" y="45" text-anchor="middle">Visit my Portfolio →</text>
</svg>
