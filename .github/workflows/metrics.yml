name: Metrics

on:
  schedule:
    - cron: "0 3 * * *" # ogni giorno alle 03:00 UTC
  workflow_dispatch: # avvio manuale dalla tab Actions

permissions:
  contents: write

jobs:
  languages:
    runs-on: ubuntu-latest
    steps:
      # Linguaggi per dimensione del codice nei repo (fork inclusi)
      - name: Top languages (by repo)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          repositories_forks: yes
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          config_timezone: Europe/Rome

      # Linguaggi calcolati solo sui TUOI commit (fork inclusi)
      - name: Top languages (by commit)
        uses: lowlighter/metrics@latest
        with:
          filename: metrics.languages-commits.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          repositories_forks: yes
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          config_timezone: Europe/Rome

      # Evita che GitHub sospenda il workflow dopo 60 giorni di inattività:
      # se l'ultimo commit ha più di 30 giorni, ne crea uno vuoto
      - name: Keepalive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api repos/${{ github.repository }}/commits/${{ github.event.repository.default_branch }} --jq .commit.committer.date)
          age=$(( ( $(date +%s) - $(date -d "$last" +%s) ) / 86400 ))
          echo "Ultimo commit: $age giorni fa"
          if [ "$age" -ge 30 ]; then
            git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
            cd repo
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi
