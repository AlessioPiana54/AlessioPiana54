name: Generate Snake

on:
  schedule:
    - cron: "0 4 * * *" # ogni giorno alle 04:00 UTC
  workflow_dispatch: # avvio manuale dalla tab Actions

permissions:
  contents: write
  actions: write # serve al keepalive

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7F00FF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A78BFA

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Evita che GitHub sospenda il workflow dopo 60 giorni di inattività (nessun commit)
      - name: Keepalive
        uses: gautamkrishnar/keepalive-workflow@v2
